<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000">
<title>.</title>
<style>
  html,body{
    margin:0;padding:0;background:#000;overflow:hidden;
    height:100dvh;width:100vw;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    font-family:'Inter',system-ui,sans-serif;
  }
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  #final{
    position:fixed;inset:0;
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    background:#000;
    z-index:10;padding:20px;text-align:center;
  }
  #final.on{display:flex;animation:fadeIn 1.2s ease}
  #final .mark{
    font-size:56px;color:#ff0033;margin-bottom:24px;
    text-shadow:0 0 40px #ff0033;
    animation:pulse 1.6s ease-in-out infinite;
  }
  #final .hash{
    font-family:'Bebas Neue','Impact','Arial Black',sans-serif;
    font-weight:900;
    font-size:clamp(46px, 14vw, 96px);
    line-height:.94;letter-spacing:.01em;color:#fff;
    text-shadow:0 0 60px rgba(255,0,51,.65);
  }
  #final .hash .r{color:#ff0033;display:block}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="final">
  <div class="mark">✝</div>
  <div class="hash">#впизду<br><span class="r">бывших</span></div>
</div>
<script>
(function(){
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  /* ------------- Rain ------------- */
  const rain = [];
  const RAIN_COUNT = Math.round((W * H) / 6000);
  for (let i = 0; i < RAIN_COUNT; i++){
    rain.push(makeDrop(true));
  }
  function makeDrop(init){
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -20,
      len: 10 + Math.random() * 26,
      speed: 420 + Math.random() * 520,
      alpha: 0.06 + Math.random() * 0.28,
      slant: 40 + Math.random() * 60,
    };
  }

  /* ------------- Particles ------------- */
  const particles = [];
  function spawnBurst(x, y){
    for (let i = 0; i < 22; i++){
      const a = Math.random() * Math.PI * 2;
      const s = 90 + Math.random() * 260;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 40,
        life: 1,
        maxLife: 0.55 + Math.random() * 0.55,
        size: 1 + Math.random() * 2.6,
      });
    }
    particles.push({ ring: true, x, y, life: 0.5, maxLife: 0.5, rMax: 110 });
  }

  /* ------------- Shadows ------------- */
  const shadows = [];
  const GOAL = 7;
  let caught = 0;
  let spawnTimer = 0.3;
  let victoryTimer = -1;
  let done = false;

  function spawnShadow(){
    const dir = Math.random() > 0.5 ? 1 : -1;
    const scale = 0.78 + Math.random() * 0.45;
    const baseY = H * 0.74 + Math.random() * H * 0.10;
    shadows.push({
      x: dir === 1 ? -70 : W + 70,
      y: baseY,
      dir,
      speed: (26 + Math.random() * 22) * dir,
      scale,
      w: 42 * scale,
      h: 132 * scale,
      alpha: 0,
      targetAlpha: 1,
      fading: false,
      fadeT: 0,
      hitX: 0, hitY: 0,
      sway: Math.random() * Math.PI * 2,
      hint: 0,
    });
  }

  function shadowBounds(s){
    const w = s.w * 1.1;
    return { x1: s.x - w, x2: s.x + w, y1: s.y - s.h * 1.02, y2: s.y + 2 };
  }

  function tryHit(px, py){
    for (let i = shadows.length - 1; i >= 0; i--){
      const s = shadows[i];
      if (s.fading) continue;
      const b = shadowBounds(s);
      if (px >= b.x1 && px <= b.x2 && py >= b.y1 && py <= b.y2){
        s.fading = true;
        s.fadeT = 0;
        s.hitX = px;
        s.hitY = py;
        spawnBurst(px, py);
        caught++;
        if (navigator.vibrate) navigator.vibrate(28);
        return true;
      }
    }
    if (navigator.vibrate) navigator.vibrate(5);
    return false;
  }

  /* ------------- Drawing silhouette ------------- */
  function drawShadow(s){
    if (s.alpha <= 0.01) return;

    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.translate(s.x, s.y);

    const sway = Math.sin(s.sway + performance.now() * 0.0015) * 2;
    ctx.translate(sway, 0);

    const w = s.w;
    const h = s.h;
    const headR = h * 0.105;
    const headY = -h + headR * 1.3;
    const bodyTop = headY + headR * 1.35;
    const bodyBot = -h * 0.42;
    const bodyW = w * 0.55;

    // body
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.rect(-bodyW * 0.5, bodyTop, bodyW, bodyBot - bodyTop);
    ctx.fill();
    // legs
    ctx.beginPath();
    ctx.rect(-bodyW * 0.42, bodyBot, bodyW * 0.34, h * 0.42);
    ctx.fill();
    ctx.beginPath();
    ctx.rect(bodyW * 0.08, bodyBot, bodyW * 0.34, h * 0.42);
    ctx.fill();
    // arms
    ctx.beginPath();
    ctx.rect(-bodyW * 0.5 - bodyW * 0.24, bodyTop + h * 0.05, bodyW * 0.24, h * 0.36);
    ctx.fill();
    ctx.beginPath();
    ctx.rect(bodyW * 0.5, bodyTop + h * 0.05, bodyW * 0.24, h * 0.36);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(0, headY, headR, 0, Math.PI * 2);
    ctx.fill();

    // red rim light
    const pulse = 0.45 + 0.25 * Math.sin(performance.now() * 0.003 + s.sway);
    ctx.strokeStyle = 'rgba(255,0,51,' + pulse.toFixed(3) + ')';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, headY, headR, -Math.PI * 0.75, Math.PI * 0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.5, bodyTop);
    ctx.lineTo(bodyW * 0.5, bodyBot);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bodyW * 0.5 + bodyW * 0.24, bodyTop + h * 0.05);
    ctx.lineTo(bodyW * 0.5 + bodyW * 0.24, bodyTop + h * 0.05 + h * 0.36);
    ctx.stroke();

    // dissolve
    if (s.fading){
      const t = Math.min(1, s.fadeT);
      const lx = s.hitX - s.x - sway;
      const ly = s.hitY - s.y;
      const rad = t * Math.max(W, H) * 0.55;
      const grd = ctx.createRadialGradient(lx, ly, 0, lx, ly, rad);
      grd.addColorStop(0,    'rgba(255,0,51,' + (0.95 * (1 - t)).toFixed(3) + ')');
      grd.addColorStop(0.45, 'rgba(255,0,51,' + (0.45 * (1 - t)).toFixed(3) + ')');
      grd.addColorStop(1,    'rgba(255,0,51,0)');
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(lx, ly, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.restore();
  }

  /* ------------- Main loop ------------- */
  let last = performance.now();

  function loop(now){
    if (done) return;

    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // backdrop
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // horizon glow
    const g = ctx.createRadialGradient(W * 0.5, H * 0.95, 0, W * 0.5, H * 0.95, Math.max(W, H) * 0.75);
    g.addColorStop(0,   'rgba(70,0,18,0.40)');
    g.addColorStop(0.5, 'rgba(22,0,6,0.18)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // rain
    for (let i = 0; i < rain.length; i++){
      const r = rain[i];
      r.y += r.speed * dt;
      r.x -= r.slant * dt * 0.5;
      if (r.y > H + 25 || r.x < -25){
        rain[i] = makeDrop(false);
        continue;
      }
      ctx.strokeStyle = 'rgba(170,190,225,' + r.alpha.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - r.slant * 0.05, r.y + r.len);
      ctx.stroke();
    }

    // spawn
    if (victoryTimer < 0 && caught + shadows.length < GOAL){
      spawnTimer -= dt;
      if (spawnTimer <= 0 && shadows.length < 2){
        spawnShadow();
        spawnTimer = 0.75 + Math.random() * 0.7;
      }
    }

    // update / draw shadows
    for (let i = shadows.length - 1; i >= 0; i--){
      const s = shadows[i];

      if (!s.fading){
        s.x += s.speed * dt;
        if (s.alpha < s.targetAlpha) s.alpha = Math.min(s.targetAlpha, s.alpha + dt * 2.6);
        if (s.dir === 1 && s.x > W + 130){ shadows.splice(i, 1); continue; }
        if (s.dir === -1 && s.x < -130){ shadows.splice(i, 1); continue; }
      } else {
        s.fadeT += dt * 1.7;
        s.alpha = Math.max(0, s.alpha - dt * 2.4);
        if (s.fadeT >= 1 && s.alpha <= 0.01){ shadows.splice(i, 1); continue; }
      }

      drawShadow(s);
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0){ particles.splice(i, 1); continue; }

      if (p.ring){
        const t = 1 - p.life / p.maxLife;
        ctx.strokeStyle = 'rgba(255,0,51,' + ((1 - t) * 0.85).toFixed(3) + ')';
        ctx.lineWidth = 2 * (1 - t) + 0.4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.rMax * t, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.vy += 120 * dt;
        const a = p.life / p.maxLife;
        ctx.fillStyle = 'rgba(255,0,51,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.3, p.size * a), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // victory
    if (victoryTimer < 0 && caught >= GOAL && shadows.length === 0){
      victoryTimer = 0;
    }
    if (victoryTimer >= 0){
      victoryTimer += dt;
      // затемнение
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, victoryTimer * 1.6).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);

      if (victoryTimer > 0.9){
        done = true;
        document.getElementById('final').classList.add('on');
        if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 80]);
        return;
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ------------- Input ------------- */
  function onPointer(e){
    if (done) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    tryHit(p.clientX, p.clientY);
  }
  canvas.addEventListener('pointerdown', onPointer);
  canvas.addEventListener('touchstart', onPointer, { passive: false });
})();
</script>
</body>
</html>
